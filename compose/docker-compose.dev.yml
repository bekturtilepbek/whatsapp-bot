name: platform-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    # 127.0.0.1, не 0.0.0.0: иначе порт виден всей локальной сети (Wi-Fi) — Redis без
    # пароля позволял бы любому соседу писать в wa:out (сообщения с реального номера
    # demo-qr), gateway — дёргать /bots/:id/logout без авторизации (2026-09-29).
    ports:
      # 5433 на хосте: на машине разработчика свой Windows-Postgres уже слушает 5432 —
      # с хоста localhost:5432 уходил в НЕГО (make migrate мигрировал бы не ту базу).
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # 127.0.0.1, не 0.0.0.0: иначе порт виден всей локальной сети (Wi-Fi) — Redis без
    # пароля позволял бы любому соседу писать в wa:out (сообщения с реального номера
    # demo-qr), gateway — дёргать /bots/:id/logout без авторизации (2026-09-29).
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PORT: "8080"
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/media
    # 127.0.0.1, не 0.0.0.0: иначе порт виден всей локальной сети (Wi-Fi) — Redis без
    # пароля позволял бы любому соседу писать в wa:out (сообщения с реального номера
    # demo-qr), gateway — дёргать /bots/:id/logout без авторизации (2026-09-29).
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../services/gateway/src:/app/src
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    # Без этого секреты (OPENAI_API_KEY и т.п.) заполняются только через
    # интерполяцию `${VAR:-}` в environment: ниже, которая работает ТОЛЬКО
    # если сам `docker compose` вызван с `--env-file ../.env` — любой
    # рестарт/пересоздание контейнера мимо этого (Docker Desktop, ручной
    # `docker compose up` из другой директории) тихо даёт пустой ключ, без
    # единой ошибки на старте (найдено живьём 2026-09-19 — сломало и
    # тестовый чат, и создание товара после незамеченного рестарта стека).
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "8081"
      # OPENAI_API_KEY/TELEGRAM_BOT_TOKEN — из env_file выше (ADR-007), не
      # здесь: явная интерполяция `${VAR:-}` тут переопределила бы то, что
      # уже подставил env_file, значением по умолчанию (пустая строка),
      # если сам `docker compose` вызван без --env-file — environment:
      # всегда побеждает env_file.
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/media
    volumes:
      - ../services/worker/src:/app/services/worker/src
      - ../libs:/app/libs
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Больше SHUTDOWN_DRAIN_TIMEOUT_SECONDS в consumer.py (25с) — иначе
    # Docker пришлёт SIGKILL раньше, чем воркер успеет дождаться уже
    # запущенных обработчиков естественного завершения (без этого запаса
    # graceful drain бессмысленен: рестарт/деплой убивал бы контейнер по
    # старому дефолту 10с, как и до этого фикса).
    stop_grace_period: 35s

  celery:
    build:
      context: ..
      dockerfile: services/celery/Dockerfile
    # См. комментарий у worker выше — тот же приём.
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      # OPENAI_API_KEY — из env_file выше (ADR-007), см. комментарий у worker.
    volumes:
      - ../services/celery/src:/app/services/celery/src
      - ../libs:/app/libs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    # См. комментарий у worker выше — тот же приём.
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://platform:platform@postgres:5432/platform
      REDIS_URL: redis://redis:6379/0
      GATEWAY_URL: http://gateway:8080
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /data/media
      JWT_SECRET: dev-insecure-jwt-secret-do-not-use-in-prod
      PLATFORM_OWNER_EMAIL: owner@dev.local
      PLATFORM_OWNER_PASSWORD: devpassword123
      # OPENAI_API_KEY — из env_file выше (ADR-007), см. комментарий у worker.
    # 127.0.0.1, не 0.0.0.0: иначе порт виден всей локальной сети (Wi-Fi) — Redis без
    # пароля позволял бы любому соседу писать в wa:out (сообщения с реального номера
    # demo-qr), gateway — дёргать /bots/:id/logout без авторизации (2026-09-29).
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../services/api/src:/app/services/api/src
      - ../libs:/app/libs
      - media-data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: ../services/admin-web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      # Docker Desktop на Windows не пробрасывает inotify-события бинд-маунтов
      # в контейнер — файловый вотчер Next.js молча не видел правок на хосте
      # (найдено живьём, 2026-09-18: hot-reload не сработал ни разу, помог
      # только полный restart контейнера). Polling — медленнее, но надёжен
      # независимо от хостовой ОС.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../services/admin-web/app:/app/app
      - ../services/admin-web/components:/app/components
      - ../services/admin-web/lib:/app/lib
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/bots').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  media-data:
