name: platform-prod

# Прод: без volume-маунтов исходников (образ самодостаточен), restart-политики,
# наружу на хост смотрит только api и admin-web — и то на 127.0.0.1
# (STAGE1_CORE Блок 3: "слушаем localhost, доступ через SSH-туннель";
# роли и доступы — сданы, FEATURES.md 6.18, JWT_SECRET/PLATFORM_OWNER_*).
# Секреты — только из .env на сервере (ADR-007), сюда не хардкодим.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ../services/gateway
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PORT: "8080"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT не задан в .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET не задан в .env}
      S3_REGION: ${S3_REGION:-fra1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY не задан в .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY не задан в .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: "8081"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY не задан в .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT не задан в .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET не задан в .env}
      S3_REGION: ${S3_REGION:-fra1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY не задан в .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY не задан в .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery:
    build:
      context: ..
      dockerfile: services/celery/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY не задан в .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      GATEWAY_URL: http://gateway:8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET не задан в .env}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:?PLATFORM_OWNER_EMAIL не задан в .env}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:?PLATFORM_OWNER_PASSWORD не задан в .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY не задан в .env}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT не задан в .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET не задан в .env}
      S3_REGION: ${S3_REGION:-fra1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY не задан в .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY не задан в .env}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: ../services/admin-web
      dockerfile: Dockerfile.prod
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/bots').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
