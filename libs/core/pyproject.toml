[project]
name = "core"
version = "0.1.0"
description = "Доменные типы, конфиг, события (Pydantic из контракта)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
