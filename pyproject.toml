# Корневой конфиг инструментов качества. Пакеты живут в libs/* и services/*.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "services/gateway", "services/admin-web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# RUF001-003: комментарии и докстроки — по-русски (CLAUDE.md), кириллица не "ambiguous"
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "libs/core/src:libs/db/src:libs/llm/src:libs/integrations/src:services/worker/src:services/api/src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mypy_boto3_s3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services/worker", "services/api"]
norecursedirs = [".venv", "node_modules"]
