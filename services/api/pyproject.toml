[project]
name = "api"
version = "0.1.0"
description = "FastAPI: управление ботами, QR/logout-прокси к gateway, ручной release handoff"
requires-python = ">=3.12"
dependencies = [
    "core",
    "db",
    "integrations",
    "llm",
    "scheduling",
    "tools",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
